<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Visualisasi Hasil Packing</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #16191d;
    --line: #262b31;
    --text: #d8dce1;
    --muted: #7a8290;
    --accent: #4fd1a5;
    --fragile: #e8926b;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #panel {
    width: 340px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px;
    overflow-y: auto;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px 0;
    font-weight: 500;
  }
  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 14px;
  }
  textarea {
    width: 100%;
    height: 220px;
    background: #0a0c0e;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px;
    border-radius: 4px;
    resize: vertical;
  }
  input[type="text"] {
    width: 100%;
    background: #0a0c0e;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 8px;
    border-radius: 4px;
  }
  button {
    width: 100%;
    margin-top: 10px;
    background: var(--accent);
    color: #06110d;
    border: none;
    padding: 9px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.88; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  #status {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  #legend {
    margin-top: 20px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  #items-list {
    margin-top: 12px;
    font-size: 11px;
    max-height: 220px;
    overflow-y: auto;
  }
  .item-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
  .item-row .name { color: var(--text); }
  .item-row.unfitted .name { color: var(--fragile); }
  #canvas-wrap { flex: 1; position: relative; }
  #canvas-wrap canvas { display: block; }
  #hint {
    position: absolute;
    bottom: 14px;
    left: 14px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div id="panel">
  <h1>Visualisasi Packing</h1>

  <label>Ambil dari API (opsional)</label>
  <input type="text" id="api-url" placeholder="http://localhost:8000/pengiriman/1/visualisasi">
  <button id="fetch-btn" class="secondary">Ambil dari API</button>

  <label>Atau tempel JSON manual</label>
  <textarea id="json-input" placeholder='{"karoseri": {"panjang":400,"lebar":200,"tinggi":200}, "items": [{"barang_id":1,"nama":"Kardus A","panjang":50,"lebar":40,"tinggi":30,"posisi_x":0,"posisi_y":0,"posisi_z":0,"orientasi":0,"is_fragile":false}]}'></textarea>
  <button id="render-btn">Render</button>

  <div id="status"></div>

  <div id="legend">
    <div class="legend-row"><div class="swatch" style="background:#5b8def"></div> Barang biasa</div>
    <div class="legend-row"><div class="swatch" style="background:var(--fragile)"></div> Fragile</div>
    <div class="legend-row"><div class="swatch" style="background:transparent;border:1px solid var(--line)"></div> Kotak kargo (karoseri)</div>
  </div>

  <div id="items-list"></div>
</div>

<div id="canvas-wrap">
  <div id="hint">drag: orbit &nbsp;·&nbsp; scroll: zoom &nbsp;·&nbsp; shift+drag: pan</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
let scene, camera, renderer, controls;
const canvasWrap = document.getElementById('canvas-wrap');

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1013);

  camera = new THREE.PerspectiveCamera(50, canvasWrap.clientWidth / canvasWrap.clientHeight, 0.1, 5000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight);
  canvasWrap.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(1, 1.4, 1);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dir2.position.set(-1, -0.5, -1);
  scene.add(dir2);

  window.addEventListener('resize', () => {
    camera.aspect = canvasWrap.clientWidth / canvasWrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function clearScene() {
  while (scene.children.length > 0) {
    scene.remove(scene.children[0]);
  }
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(1, 1.4, 1);
  scene.add(dir);
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = isError ? '#e8926b' : '#7a8290';
}

function renderData(data) {
  clearScene();
  const itemsListEl = document.getElementById('items-list');
  itemsListEl.innerHTML = '';

  const k = data.karoseri || {};
  const P = k.panjang || 100, L = k.lebar || 100, T = k.tinggi || 100;

  // Kotak kargo -- wireframe transparan, origin di pojok bawah (0,0,0)
  // sesuai konvensi py3dbp/hasil_packing.
  const boxGeo = new THREE.BoxGeometry(P, T, L); // three.js: Y = tinggi
  const edges = new THREE.EdgesGeometry(boxGeo);
  const boxLine = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x4fd1a5, opacity: 0.6, transparent: true }));
  boxLine.position.set(P / 2, T / 2, L / 2);
  scene.add(boxLine);

  const floorGeo = new THREE.PlaneGeometry(P * 1.4, L * 1.4);
  const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: 0x16191d, side: THREE.DoubleSide }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(P / 2, 0, L / 2);
  scene.add(floor);

  let unfittedCount = 0;
  const items = data.items || [];

  items.forEach((it) => {
    const p = it.panjang || 1, l = it.lebar || 1, t = it.tinggi || 1;
    const geo = new THREE.BoxGeometry(p, t, l);
    const color = it.is_fragile ? 0xe8926b : 0x5b8def;
    const mat = new THREE.MeshStandardMaterial({ color, opacity: 0.88, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);

    // posisi_x/y/z dari backend = FLB (front-left-bottom) py3dbp;
    // di three.js digeser +setengah dimensi supaya box origin di tengah.
    mesh.position.set(
      (it.posisi_x || 0) + p / 2,
      (it.posisi_z || 0) + t / 2,
      (it.posisi_y || 0) + l / 2
    );

    const edgesItem = new THREE.EdgesGeometry(geo);
    const line = new THREE.LineSegments(edgesItem, new THREE.LineBasicMaterial({ color: 0x0a0c0e }));
    mesh.add(line);

    scene.add(mesh);

    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `<span class="name">${it.nama || ('#' + it.barang_id)}</span><span>${p}×${l}×${t}</span>`;
    itemsListEl.appendChild(row);
  });

  if (unfittedCount > 0) {
    setStatus(`${items.length} barang dirender. ${unfittedCount} barang tidak muat.`, true);
  } else {
    setStatus(`${items.length} barang dirender.`, false);
  }

  // posisikan kamera supaya seluruh kargo kelihatan
  const maxDim = Math.max(P, L, T);
  camera.position.set(P * 1.3, maxDim * 1.1, L * 1.6);
  controls.target.set(P / 2, T / 3, L / 2);
  controls.update();
}

document.getElementById('render-btn').addEventListener('click', () => {
  const raw = document.getElementById('json-input').value.trim();
  if (!raw) { setStatus('Tempel JSON dulu, atau ambil dari API.', true); return; }
  try {
    const data = JSON.parse(raw);
    renderData(data);
  } catch (e) {
    setStatus('JSON tidak valid: ' + e.message, true);
  }
});

document.getElementById('fetch-btn').addEventListener('click', async () => {
  const url = document.getElementById('api-url').value.trim();
  if (!url) { setStatus('Isi URL endpoint /visualisasi dulu.', true); return; }
  setStatus('Mengambil data...', false);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('json-input').value = JSON.stringify(data, null, 2);
    renderData(data);
  } catch (e) {
    setStatus('Gagal fetch: ' + e.message + '\n(kalau API di localhost dan file ini dibuka langsung dari disk, pastikan CORS diizinkan di FastAPI)', true);
  }
});

initScene();
setStatus('Tempel JSON hasil dari /pengiriman/{id}/visualisasi, lalu klik Render.', false);
</script>

</body>
</html>
