version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: volumetrix_backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - HOST=0.0.0.0
      - PORT=8001
